services:
  falkordb:
    ports:
      - "127.0.0.1:6379:6379"
    image: falkordb/falkordb:latest
    restart: unless-stopped
    volumes:
    - veyra_graph_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - path: .env
      required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: '6379'
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
    - 8000:8000
    depends_on:
      falkordb:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
    - 8080:80
    depends_on:
    - backend
volumes:
  veyra_graph_data: null
